name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  app:
    name: Lint, typecheck, tests, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (vitest + upstream node:test)
        run: npm test
      - name: Build
        run: npm run build:packages && npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test (mock flow)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Compose config and images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose for every profile
        run: |
          cp .env.example .env
          for p in mock wan2gp comfyui full; do
            echo "profile $p: $(docker compose --profile "$p" config --services | tr '\n' ' ')"
            docker compose --profile "$p" config --quiet
          done
          docker compose -f docker-compose.yml --profile full config --quiet
      - name: Lint Dockerfiles
        run: |
          docker build --check -f docker/studio/Dockerfile .
          docker build --check docker/wan2gp
          docker build --check docker/comfyui
      - name: Build studio image
        run: docker build -f docker/studio/Dockerfile -t zellijfield-ai/studio:ci .
      - name: Smoke-run studio image (mock)
        run: |
          docker run -d --name studio -p 127.0.0.1:3000:3000 zellijfield-ai/studio:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health; then echo; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/models | grep -q '"wan-2.2-t2v"'
          test "$(docker inspect -f '{{.Config.User}}' studio)" = "node"
          docker logs studio
